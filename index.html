<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e8">
  <title>キャラメモ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">ORIGINAL CHARACTER NOTE</p>
        <h1>キャラメモ</h1>
      </div>
      <button id="addBtn" class="btn btn-primary">＋ キャラを追加</button>
    </header>

    <section class="toolbar">
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="名前や特徴で検索">
      </label>
      <span id="countLabel" class="count">0キャラ</span>
    </section>

    <main>
      <section id="emptyState" class="empty">
        <div class="empty-mark">✦</div>
        <h2>最初のキャラを残そう</h2>
        <p>画像と名前、特徴だけで気軽にカードを作れます。</p>
        <button id="emptyAddBtn" class="btn btn-primary">＋ キャラを追加</button>
      </section>
      <section id="cardGrid" class="card-grid" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="editorDialog" class="dialog">
    <form id="editorForm" method="dialog">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">CHARACTER CARD</p>
          <h2 id="dialogTitle">キャラを追加</h2>
        </div>
        <button type="button" id="closeBtn" class="icon-btn" aria-label="閉じる">×</button>
      </div>

      <div class="editor-layout">
        <div class="image-editor">
          <label class="image-drop" for="imageInput">
            <img id="imagePreview" alt="" hidden>
            <div id="imagePlaceholder">
              <span class="camera">＋</span>
              <strong>画像を選ぶ</strong>
              <small>写真・スクリーンショットなど</small>
            </div>
          </label>
          <input id="imageInput" type="file" accept="image/*" hidden>
          <button type="button" id="removeImageBtn" class="text-btn" hidden>画像を外す</button>
        </div>

        <div class="fields">
          <label>
            <span>名前</span>
            <input id="nameInput" type="text" maxlength="40" placeholder="キャラの名前" required>
          </label>
          <label>
            <span>特徴</span>
            <textarea id="featuresInput" rows="8" maxlength="1200" placeholder="性格、見た目、口ぐせ、好きなもの、設定など自由にメモ"></textarea>
          </label>
        </div>
      </div>

      <div class="dialog-actions">
        <button type="button" id="deleteBtn" class="btn btn-danger" hidden>削除</button>
        <div class="spacer"></div>
        <button type="button" id="cancelBtn" class="btn btn-secondary">キャンセル</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
